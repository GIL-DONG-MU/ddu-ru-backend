spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  application:
    name: gildongmu
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
oauth:
  kakao:
    rest-client-id: ${KAKAO_REST_CLIENT_ID}
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
#    redirect-uri: ${KAKAO_REDIRECT_URI}

  google:
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID}
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID}
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
#    redirect-uri: ${GOOGLE_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

aws:
    s3:
        region: ${AWS_REGION}
        bucket: ${AWS_S3_BUCKET}
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}

coolsms:
    api-key: ${COOLSMS_API_KEY}
    api-secret: ${COOLSMS_API_SECRET}
    from-number: ${COOLSMS_FROM_NUMBER}

profile:
  default-image-url: ${PROFILE_DEFAULT_IMAGE_URL}

app:
  logging:
    performance:
      warn-threshold-ms: 300

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    validator-url: none
    urls:
      - name: public
        url: /v3/api-docs/public
      - name: admin
        url: /v3/api-docs/admin
    urls-primary-name: public
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

fcm:
  service-account-path: firebase/service-account.json

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [reqId=%X{requestId:-} ip=%X{clientIp:-} method=%X{method:-} uri=%X{uri:-} userId=%X{userId:-} ua=%X{userAgent:-}] %msg%n"
