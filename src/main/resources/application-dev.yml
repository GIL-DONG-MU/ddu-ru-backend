spring:
  config:
    activate:
      on-profile: dev
  # Flyway가 classpath:db/migration 스크립트를 먼저 적용
  datasource:
    url: jdbc:mysql://localhost:3307/dduru?characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  expiration: 2592000

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.cache: trace # Redis

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
