<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Success</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 90%;
        }

        h1 {
            color: #28a745;
        }

        h2 {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
            margin-top: 30px;
            font-size: 1.2em;
            color: #495057;
        }

        p {
            word-break: break-all;
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            font-family: monospace, sans-serif;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✅ <span th:text="${provider}"></span> Login Test Success!</h1>
    <h2>Received idToken:</h2>
    <p id="idToken" th:text="${idToken}">id_token_value</p>
    <button onclick="copyToken()">Copy Token</button>
</div>

<script>
    function copyToken() {
        const tokenElement = document.getElementById('idToken');
        const token = tokenElement.textContent;
        const button = document.querySelector('button');

        navigator.clipboard.writeText(token).then(() => {
            button.textContent = 'Copied!';
            setTimeout(() => {
                button.textContent = 'Copy Token';
            }, 2000);
        }).catch(err => {
            alert('토큰 복사 실패: ' + err);
        });
    }
</script>
</body>
</html>
