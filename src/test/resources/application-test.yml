spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  expiration: -1
  secret: test-secret-key-for-jwt
  refresh-expiration: 3600000

aws:
  s3:
    enabled: false
    region: ap-northeast-2
    bucket: dummy-bucket
    access-key: dummy
    secret-key: dummy

oauth:
  kakao:
    rest-client-id: dummy
    client-id: dummy
    client-secret: dummy
    redirect-uri: http://localhost
  google:
    android-client-id: dummy
    ios-client-id: dummy
    client-id: dummy
    client-secret: dummy
    redirect-uri: http://localhost

coolsms:
  api-key: dummy
  api-secret: dummy
  from-number: 01000000000

profile:
    default-image-url: http://example.com/default-profile.png

logging:
  level:
    com.dduru.gildongmu: debug
    org.springframework.security: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
